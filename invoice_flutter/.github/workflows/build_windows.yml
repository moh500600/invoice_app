name: Build Applications (Windows EXE & Android APK)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (EXE)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Determine Project Path
        id: set_path
        shell: pwsh
        run: |
          if (Test-Path "./invoice_flutter/pubspec.yaml") {
            echo "project_path=./invoice_flutter" >> $env:GITHUB_OUTPUT
          } else {
            echo "project_path=." >> $env:GITHUB_OUTPUT
          }

      - name: Install Dependencies
        run: |
          cd ${{ steps.set_path.outputs.project_path }}
          flutter pub get

      - name: Build Windows Application (Release)
        run: |
          cd ${{ steps.set_path.outputs.project_path }}
          flutter build windows --release

      - name: Bundle Visual C++ Runtime DLLs (Fix MSVCP140.dll & VCRUNTIME140.dll)
        shell: pwsh
        run: |
          $buildDir = "${{ steps.set_path.outputs.project_path }}/build/windows/x64/runner/Release"
          if (-not (Test-Path $buildDir)) {
            $buildDir = "${{ steps.set_path.outputs.project_path }}/build/windows/runner/Release"
          }
          Write-Host "Target build directory: $buildDir"
          # Copy VC++ runtime DLLs from System32 into the release folder so the app runs out-of-the-box on any Windows machine
          Copy-Item "C:\Windows\System32\msvcp140*.dll" -Destination $buildDir -Force -ErrorAction SilentlyContinue
          Copy-Item "C:\Windows\System32\vcruntime140*.dll" -Destination $buildDir -Force -ErrorAction SilentlyContinue
          # Also try MSVC Redist directory if available
          $vcRedistPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC"
          if (Test-Path $vcRedistPath) {
            Get-ChildItem -Path $vcRedistPath -Recurse -Filter "*.dll" | Where-Object { $_.DirectoryName -match "x64" } | Copy-Item -Destination $buildDir -Force -ErrorAction SilentlyContinue
          }
          Get-ChildItem -Path $buildDir -Filter "*.dll" | Select-Object Name

      - name: Package Windows Release (ZIP)
        shell: pwsh
        run: |
          $buildDir = "${{ steps.set_path.outputs.project_path }}/build/windows/x64/runner/Release"
          if (-not (Test-Path $buildDir)) {
            $buildDir = "${{ steps.set_path.outputs.project_path }}/build/windows/runner/Release"
          }
          Compress-Archive -Path "$buildDir/*" -DestinationPath "./InvoiceApp-Windows-EXE.zip"

      - name: Upload Windows EXE as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceApp-Windows-x64
          path: ./InvoiceApp-Windows-EXE.zip
          retention-days: 30

  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Determine Project Path
        id: set_path
        run: |
          if [ -f "./invoice_flutter/pubspec.yaml" ]; then
            echo "project_path=./invoice_flutter" >> $GITHUB_OUTPUT
          else
            echo "project_path=." >> $GITHUB_OUTPUT
          fi

      - name: Install Dependencies
        run: |
          cd ${{ steps.set_path.outputs.project_path }}
          flutter pub get

      - name: Build Android APK
        run: |
          cd ${{ steps.set_path.outputs.project_path }}
          flutter build apk --release

      - name: Upload Android APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceApp-Android-APK
          path: ${{ steps.set_path.outputs.project_path }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
