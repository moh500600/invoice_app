name: Build Windows Application (EXE)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Application (Release)
        run: flutter build windows --release

      - name: Package Windows Release (ZIP)
        shell: pwsh
        run: |
          $buildDir = "./build/windows/x64/runner/Release"
          if (-not (Test-Path $buildDir)) {
            $buildDir = "./build/windows/runner/Release"
          }
          Compress-Archive -Path "$buildDir/*" -DestinationPath "./InvoiceApp-Windows-EXE.zip"

      - name: Upload Windows EXE as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceApp-Windows-x64
          path: ./InvoiceApp-Windows-EXE.zip
          retention-days: 30
